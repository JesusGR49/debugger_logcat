plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.debuuger_logcat'
    compileSdk 34  // <-- Cambiar de 33 a 34

    defaultConfig {
        applicationId "com.example.debuuger_logcat"
        minSdk 24
        targetSdk 34 // <-- Cambiar de 33 a 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    // ... lo demás se queda igual

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Fuerzas la versión 1.7.2 que es totalmente compatible con compileSdk 33
    implementation 'androidx.activity:activity:1.7.2'

    // Tus otras librerías que ya tenías
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}